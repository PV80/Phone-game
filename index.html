<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dead Line" />
  <meta name="description" content="Dead Line — a mobile zombie last-stand shooter. Move side to side, blast the horde, hit the target to unlock guns, gunners and power-ups." />
  <title>Dead Line — Zombie Last Stand</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="hud hidden">
      <div class="hud-top">
        <div class="hud-stat">
          <span class="hud-label">WAVE</span>
          <span id="hud-wave" class="hud-value">1</span>
        </div>
        <div class="hud-stat">
          <span class="hud-label">SCORE</span>
          <span id="hud-score" class="hud-value">0</span>
        </div>
        <div class="hud-stat">
          <span class="hud-label">KILLS</span>
          <span id="hud-kills" class="hud-value">0</span>
        </div>
        <button id="btn-pause" class="icon-btn" aria-label="Pause">II</button>
      </div>

      <div class="hud-health">
        <div class="bar-label">HP</div>
        <div class="bar-track"><div id="hp-fill" class="bar-fill"></div></div>
      </div>

      <div class="hud-weapon">
        <div class="weapon-chip">
          <span id="hud-weapon-icon"></span>
          <span id="hud-weapon-name">Pistol</span>
        </div>
        <div class="hud-target">
          <span class="target-icon">◎</span>
          <span id="hud-target-progress">Hit the target to unlock!</span>
        </div>
      </div>
    </div>

    <!-- Touch controls -->
    <div id="touch-controls" class="touch-controls hidden">
      <button id="ctrl-left" class="move-btn" aria-label="Move left">◀</button>
      <button id="ctrl-fire" class="fire-btn" aria-label="Fire">FIRE</button>
      <button id="ctrl-right" class="move-btn" aria-label="Move right">▶</button>
    </div>

    <!-- Start screen -->
    <div id="screen-start" class="overlay">
      <div class="panel">
        <h1 class="game-title">DEAD LINE</h1>
        <p class="subtitle">Zombie Last Stand</p>
        <div class="best-line">Best Score: <span id="best-score">0</span></div>
        <button id="btn-start" class="big-btn">TAP TO PLAY</button>
        <div class="how-to">
          <p><b>Move</b> — drag or use ◀ ▶</p>
          <p><b>Shoot</b> — auto-fire + FIRE button</p>
          <p><b>Unlock</b> — hit the ◎ target to earn guns, gunners &amp; power-ups</p>
        </div>
        <button id="btn-sound" class="text-btn">🔊 Sound: On</button>
      </div>
    </div>

    <!-- Pause screen -->
    <div id="screen-pause" class="overlay hidden">
      <div class="panel">
        <h2>Paused</h2>
        <button id="btn-resume" class="big-btn">RESUME</button>
        <button id="btn-quit" class="text-btn">Quit to menu</button>
      </div>
    </div>

    <!-- Unlock toast -->
    <div id="unlock-toast" class="unlock-toast hidden">
      <div class="unlock-inner">
        <div class="unlock-title">UNLOCKED!</div>
        <div id="unlock-text" class="unlock-text"></div>
      </div>
    </div>

    <!-- Game over -->
    <div id="screen-over" class="overlay hidden">
      <div class="panel">
        <h2 class="over-title">YOU DIED</h2>
        <div class="over-stats">
          <div><span class="over-num" id="over-score">0</span><span class="over-lbl">Score</span></div>
          <div><span class="over-num" id="over-wave">1</span><span class="over-lbl">Wave</span></div>
          <div><span class="over-num" id="over-kills">0</span><span class="over-lbl">Kills</span></div>
        </div>
        <div id="over-best" class="over-best"></div>
        <button id="btn-retry" class="big-btn">PLAY AGAIN</button>
        <button id="btn-menu" class="text-btn">Main menu</button>
      </div>
    </div>
  </div>

  <script src="assets/sprites/atlas.js"></script>
  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
